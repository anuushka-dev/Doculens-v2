services:
  api:
    image: doculens-api:0.2.0
    build: .
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=134217728,mode=1777
    volumes:
      - embedding-cache:/models
    ports:
      - "127.0.0.1:${DOCULENS_PORT:-8000}:8000"
    environment:
      DOCULENS_ENVIRONMENT: production
      DOCULENS_LOG_LEVEL: "${DOCULENS_LOG_LEVEL:-INFO}"
      DOCULENS_MAX_UPLOAD_BYTES: "${DOCULENS_MAX_UPLOAD_BYTES:-20971520}"
      DOCULENS_MAX_PDF_PAGES: "${DOCULENS_MAX_PDF_PAGES:-350}"
      DOCULENS_MAX_EXTRACTED_CHARS: "${DOCULENS_MAX_EXTRACTED_CHARS:-4000000}"
      DOCULENS_OLLAMA_BASE_URL: http://ollama:11434
      DOCULENS_OLLAMA_MODEL: "${DOCULENS_OLLAMA_MODEL:-qwen3.5:4b}"
      DOCULENS_OLLAMA_NUM_CTX: "${DOCULENS_OLLAMA_NUM_CTX:-16384}"
      DOCULENS_OLLAMA_NUM_BATCH: "${DOCULENS_OLLAMA_NUM_BATCH:-128}"
      DOCULENS_OLLAMA_NUM_PREDICT: "${DOCULENS_OLLAMA_NUM_PREDICT:-1024}"
      DOCULENS_OLLAMA_TEMPERATURE: "${DOCULENS_OLLAMA_TEMPERATURE:-0}"
      DOCULENS_OLLAMA_SEED: "${DOCULENS_OLLAMA_SEED:-42}"
      DOCULENS_OLLAMA_TIMEOUT_SECONDS: "${DOCULENS_OLLAMA_TIMEOUT_SECONDS:-120}"
      DOCULENS_RETRIEVAL_MODE: "${DOCULENS_RETRIEVAL_MODE:-hybrid}"
      DOCULENS_RETRIEVAL_TOP_K: "${DOCULENS_RETRIEVAL_TOP_K:-8}"
      DOCULENS_EVIDENCE_THRESHOLD: "${DOCULENS_EVIDENCE_THRESHOLD:-0.25}"
      DOCULENS_MAX_CONTEXT_CHARS: "${DOCULENS_MAX_CONTEXT_CHARS:-8000}"
      DOCULENS_DOCUMENT_TTL_SECONDS: "${DOCULENS_DOCUMENT_TTL_SECONDS:-3600}"
      DOCULENS_MAX_CACHED_DOCUMENTS: "${DOCULENS_MAX_CACHED_DOCUMENTS:-8}"
      DOCULENS_MAX_CACHED_TEXT_BYTES: "${DOCULENS_MAX_CACHED_TEXT_BYTES:-67108864}"
      DOCULENS_EXTRACTION_MAX_REPAIR_ATTEMPTS: "${DOCULENS_EXTRACTION_MAX_REPAIR_ATTEMPTS:-1}"
      DOCULENS_ENABLE_GROUNDED_SYNTHESIS: "${DOCULENS_ENABLE_GROUNDED_SYNTHESIS:-true}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      ollama:
        condition: service_healthy
  ollama:
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Independent PDF questions do not need the default multi-GiB prompt cache.
      LLAMA_ARG_CACHE_RAM: "0"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No public Ollama port. Only the API container can reach this service.
volumes:
  embedding-cache:
  ollama-models:
